[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kepler-cli"
version = "0.1.0"
description = "Kepler 1.1 CLI — open local allow/ask/deny for coding agents (Kyros Labs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aly Maknojiya", email = "hello@kyroslabs.tech" }]
dependencies = [
  "laya>=0.3.0",
  "numpy<2",
  "transformers>=4.48.0,<5",
]

[project.scripts]
kepler = "kepler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kepler*"]
