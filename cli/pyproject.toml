[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kepler-cli"
version = "0.3.0"
description = "Kepler 1.2 CLI — open local System One (choice / noul / score / gate) — Kyros Labs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kyros Labs", email = "hello@kyroslabs.tech" }]
dependencies = [
  "laya>=0.3.0",
  "numpy<2",
  "transformers>=4.48.0,<5",
]

[project.scripts]
kepler = "kepler.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kepler*"]

[tool.setuptools.package-data]
kepler = ["assets/*.png"]
